version: '3.3'

volumes:
  pg_data:
  static:
  media:
  frontend_build:

services:
  db:
    container_name: foodgram-db
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    container_name: foodgram-backend
    image: alevtinamuz/foodgram_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/app/collected_static
      - media:/app/media
  frontend:
    container_name: foodgram-front
    image: alevtinamuz/foodgram_frontend:latest
    command: cp -r /app/build/. /frontend_build/
    volumes:
      - frontend_build:/frontend_build
  nginx:
    container_name: foodgram-proxy
    image: alevtinamuz/foodgram_gateway:latest
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - frontend_build:/usr/share/nginx/html
      - static:/staticfiles
      - media:/media
